name: Update latest posts and videos

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.simplehomelab.com/feed/"
          max_post_count: 5
          comment_tag_name: BLOG-POST-LIST
          commit_message: "Update latest blog posts"

      - name: Latest YouTube videos
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCRNslbwLLvFWzTolVCBgXYA"
          max_post_count: 4
          comment_tag_name: YOUTUBE
          commit_message: "Update latest YouTube videos"
